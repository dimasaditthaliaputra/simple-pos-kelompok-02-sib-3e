# Perbandingan pengalaman: Postman vs curl
# Saat menguji tiga endpoint (login, products, transactions) memakai Postman,
# base URL dan token cukup disimpan sekali sebagai variabel environment, lalu
# header Authorization terpasang otomatis lewat {{token}} di setiap request,
# sedangkan di curl semua -H dan -d harus diketik ulang pada tiap perintah.
# Respons JSON di Postman tampil rapi, status code dan waktu responsnya jelas,
# dan request bisa disimpan lalu diulang dengan satu klik, sehingga uji
# idempotency (kirim ulang dengan key yang sama) jauh lebih cepat. Curl tetap
# unggul untuk percobaan singkat di terminal, mudah disalin ke dokumentasi atau
# skrip, dan tidak butuh aplikasi tambahan, tetapi tidak menyimpan riwayat dan
# keluarannya mentah sehingga lebih sulit dibaca.

openapi: 3.0.0
info:
  title: Simple POS API
  version: 1.0.0

servers:
  - url: http://127.0.0.1:8000

paths:
  /api/v1/login:
    post:
      summary: Login dan dapatkan token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Token berhasil diterbitkan
        '401':
          description: Kredensial tidak valid

  /api/v1/logout:
    post:
      summary: Logout dan hapus token aktif
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout berhasil
        '401':
          description: Token tidak ada atau tidak valid

  /api/v1/categories:
    get:
      summary: Ambil daftar kategori
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daftar kategori berhasil diambil
        '401':
          description: Token tidak ada atau tidak valid

  /api/v1/products:
    get:
      summary: Ambil daftar produk
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
        - name: category_id
          in: query
          schema:
            type: integer
        - name: q
          in: query
          schema:
            type: string
            minLength: 2
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - name
              - '-name'
              - price
              - '-price'
            default: name
      responses:
        '200':
          description: Daftar produk berpaginasi
        '401':
          description: Token tidak ada atau tidak valid
        '422':
          description: Parameter query tidak valid

  /api/v1/transactions:
    post:
      summary: Buat transaksi baru
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id:
                        type: integer
                      qty:
                        type: integer
      responses:
        '201':
          description: Transaksi berhasil disimpan
        '400':
          description: Header Idempotency-Key wajib diisi
        '401':
          description: Token tidak ada atau tidak valid
        '409':
          description: Request dengan key ini masih diproses
        '422':
          description: Input tidak valid atau key dipakai untuk request lain

  /api/v1/transactions/{transaction}:
    get:
      summary: Lihat detail transaksi
      security:
        - bearerAuth: []
      parameters:
        - name: transaction
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detail transaksi berhasil diambil
        '401':
          description: Token tidak ada atau tidak valid
        '404':
          description: Transaksi tidak ditemukan

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
